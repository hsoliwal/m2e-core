# feature.properties
# contains externalized strings for feature.xml
# "%foo" in feature.xml corresponds to the key "foo" in this file
# java.io.Properties file (ISO 8859-1 with "\" escapes)
# This file should be translated.

# "featureName" property - name of the feature
featureName=M2E - Code Clustering Language Server

# "providerName" property - name of the company that provides the feature
providerName=Eclipse.org - m2e

# "description" property - description of the feature
description=Reports duplicated code in Maven projects through Eclipse LSP4E, in the Java (JDT), \
C/C++ (CDT), Python (PyDev), XML, HTML, CSS, JSON, JavaScript and TypeScript (WTP, Wild Web Developer) \
and Rust (Corrosion, RustDT) editors. The language server is resolved through Maven and is off \
until it is enabled in Preferences > Maven > Code Clustering.

